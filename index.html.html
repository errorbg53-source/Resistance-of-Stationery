if(drag.pos&&inZ(drag.pos)){let n=null,nd=60;for(const p of st.piles){const d=Math.hypot(p.x-drag.pos.x,p.y-drag.pos.y);if(d<nd){nd=d;n=p}}c.strokeStyle=n?'#6fe08c':'#ffc93c';c.lineWidth=3;c.beginPath();c.arc(n?n.x:drag.pos.x,G-18,34,0,7);c.stroke()}}
c.restore()}

const NM={m:'MACHINE',b:'MOBILE',f:'FLYING'};

e.innerHTML=`<img class="ri" src="${cic(r)}"><div><div class="rn">${r.n}<span class="tg ${r.k}">${NM[r.k]}</span></div><div class="need">${Object.entries(r.need).map(([k,v])=>`<span><img src="${ic(k)}">×${v}</span>`).join('')}</div><div class="mu">${r.na?'':'DMG <b>'+Math.round(d)+'</b> · '}HP <b>${Math.round(h)}</b></div></div>`;
$('recipes').appendChild(e);RE.push({e,r})}rk_=''}
const ov=h=>{$('oc').innerHTML=h;$('ov').classList.remove('hid')},hide=()=>$('ov').classList.add('hid');
const nl=()=>Object.keys(RAW).filter(k=>!M.ur[k]).length+CB.filter(r=>!M.uc[r.id]).length;
function menu(){drag=null;document.querySelectorAll('.ghost').forEach(g=>g.remove());if(st&&st.status=='play')st.status='pause';const rs=st&&st.status=='pause';
ov(`<div class="logo">RESISTANCE<br>OF STATIONERY</div><div class="ico">${['pencil','stapler','ruler','pen','eraser'].map(k=>`<img src="${ic(k)}">`).join('')}</div><p class="sub">Buy stationery, <b>drag to combine</b>, and defend Stationery Land from the electronics army.<br>Earn <b>gold</b> to unlock gear, recipes and base upgrades.</p><div class="gold">⛁ ${M.gold}</div><div class="row">${rs?`<button class="btn" data-a="res">RESUME LEVEL ${st.lv}</button>`:`<button class="btn" data-a="play">PLAY LEVEL ${M.max}</button>`}<button class="btn s" data-a="ws">WORKSHOP${nl()?`<i>${nl()}</i>`:''}</button>${rs?'<button class="btn d" data-a="gu">GIVE UP</button>':''}</div><div class="row"><button class="btn s sm" data-a="how">HOW TO PLAY</button><button class="btn s sm" data-a="story">STORY</button></div>`)}
function ws(){const ro=(im,n,tg,sub,b)=>`<div class="wr">${im}<div class="wi"><div class="wn">${n}${tg}</div><div class="mu">${sub}</div></div>${b}</div>`,
bt=(a,k,cost)=>`<button class="btn sm" data-a="${a}" data-k="${k}" ${M.gold>=cost?'':'disabled'}>⛁ ${cost}</button>`,im=k=>`<img src="${ic(k)}">`;
let h=`<h2>WORKSHOP</h2><div class="gold">⛁ ${M.gold}</div><div class="wl"><div class="sh">STATIONERY</div>`;
for(const k in RAW){const r=RAW[k];if(M.ur[k]){const l=lv(k),[d,hh]=rs(k);h+=ro(im(k),r.n,`<i>LV ${l}/10</i>`,`DMG <b>${d.toFixed(1)}</b> · HP <b>${Math.round(hh)}</b> · +15% per level`,l>=10?'<button class="btn sm" disabled>MAX</button>':bt('up',k,upc(k)))}else h+=ro(im(k),r.n,'<i class="lk">LOCKED</i>',`DMG ${r.d} · HP ${r.h} · shop $${r.cost}`,bt('ur',k,r.u))}
h+='<div class="sh">RECIPES</div>';for(const r of CB.filter(r=>!r.s)){const u=M.uc[r.id];h+=ro(`<img src="${cic(r)}">`,r.n,u?'<i class="ok">UNLOCKED</i>':'',Object.entries(r.need).map(([k,v])=>v+'× '+RAW[k].n).join(' + '),u?'':bt('uc',r.id,r.u))}
h+='<div class="sh">BASE</div>';for(const d of BU){const l=M.b[d.k]||0;h+=ro(`<div class="em">${d.e}</div>`,d.n,`<i>LV ${l}/10</i>`,d.d,l>=10?'<button class="btn sm" disabled>MAX</button>':bt('ub',d.k,buc(d)))}
ov(h+'</div><button class="btn s" data-a="menu">BACK</button><a class="rs" data-a="reset">Reset all progress</a>')}
function end(w,gu){st.status=w?'won':'lost';const b=w?45+st.lv*22:gu?8:15+st.lv*5;if(w)M.max=Math.max(M.max,st.lv+1);M.gold+=b;save();ui();
setTimeout(()=>ov(`<div class="logo" style="font-size:36px">${w?'VICTORY!':gu?'RETREAT':'BASE DESTROYED'}</div><p class="sub">${w?'Stationery Land holds! Level '+st.lv+' cleared.':'Regroup, Commander, and upgrade your stationery.'}</p><div class="gold">+${b} ⛁ gold</div><div class="row">${w?'<button class="btn" data-a="next">NEXT LEVEL</button>':`<button class="btn" data-a="retry">RETRY LEVEL ${st.lv}</button>`}<button class="btn s" data-a="ws">WORKSHOP</button><button class="btn s" data-a="menu">MENU</button></div>`),gu?0:700)}
const done=()=>{save();bc='';rc();ws();ui()};
$('ov').onclick=e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,k=el.dataset.k;
if(a=='reset'){if(el.dataset.c){M=defM();starters();save();st=null;document.body.classList.remove('g');rc();ui();menu()}else{el.dataset.c=1;el.textContent='Tap again to permanently reset'}return}
if(a=='play')go(M.max);else if(a=='how'){M.tut=0;go(1)}else if(a=='story')intro();else if(a=='res'){st.status='play';hide()}else if(a=='ws')ws();else if(a=='menu')menu();else if(a=='gu')end(0,1);else if(a=='next')go(st.lv+1);else if(a=='retry')go(st.lv);
else if(a=='up'&&lv(k)<10&&M.gold>=upc(k)){M.gold-=upc(k);M.up[k]=lv(k)+1;done()}
else if(a=='ur'&&M.gold>=RAW[k].u){M.gold-=RAW[k].u;M.ur[k]=1;done()}
else if(a=='uc'){const r=CB.find(x=>x.id==k);if(M.gold>=r.u){M.gold-=r.u;M.uc[k]=1;done()}}
else if(a=='ub'){const d=BU.find(x=>x.k==k);if(M.gold>=buc(d)&&(M.b[k]||0)<10){M.gold-=buc(d);M.b[k]=(M.b[k]||0)+1;done()}}};
$('mb').onclick=()=>st&&st.status=='play'&&menu();$('buy').onclick=buy;$('rr').onclick=reroll;
$('recipes').onclick=e=>{const el=e.target.closest('.rcp');if(el)auto(CB.find(r=>r.id==el.dataset.id))};

/* ---------- drag & drop ---------- */
const cc=(x,y)=>{const r=cv.getBoundingClientRect();return{x:(x-r.left)*W/r.width,y:(y-r.top)*H/r.height}},inZ=p=>p.x>20&&p.x<HALF-10&&p.y>60;
$('bench').addEventListener('pointerdown',e=>{const ch=e.target.closest('.chip');if(!ch||!st||st.status!='play')return;const t=ch.dataset.k;if(!(st.bench[t]>0))return;
const g=document.createElement('img');g.className='ghost';g.src=ic(t);g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.appendChild(g);drag={t,g,pos:cc(e.clientX,e.clientY)};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';drag.pos=cc(e.clientX,e.clientY)});
document.addEventListener('pointerup',e=>{if(!drag)return;const p=cc(e.clientX,e.clientY),t=drag.t;drag.g.remove();drag=null;if(!inZ(p)||!st||!(st.bench[t]>0))return;
let n=null,nd=60;for(const q of st.piles){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<nd){nd=d;n=q}}
if(!n){n={x:p.x,y:G,items:{},b:rf(0,6)};st.piles.push(n)}n.items[t]=(n.items[t]||0)+1;st.bench[t]--;snd(420,.05,'triangle',.04);chk(n);ui()});
document.addEventListener('pointercancel',()=>{if(drag){drag.g.remove();drag=null}});
cv.addEventListener('pointerdown',e=>{if(cin){cin.t0-=(3.6-((performance.now()-cin.t0)/1000)%3.6)*1000;return}if(drag||!st||st.status!='play')return;const p=cc(e.clientX,e.clientY);
for(const q of st.piles)if(Math.hypot(q.x-p.x,q.y-p.y)<38){const k=Object.keys(q.items)[0];if(!k)continue;q.items[k]--;st.bench[k]++;if(!q.items[k])delete q.items[k];if(!Object.keys(q.items).length)st.piles=st.piles.filter(x=>x!=q);ui();return}});

/* ---------- tutorial & intro ---------- */
let cin=null,tut=-1;const tip=$('tip'),TS=['Tap BUY in the shop to buy the stationery on offer.','Drag a bench item onto your half of the battlefield (dashed zone).','Drop items on the same pile to combine them. Glowing cards in the book build with one tap!','Machines fight for you. Money ($) is tight, so spend wisely. Destroy the enemy base to win! (tap to close)'];
function tutUp(){if(tut<0){tip.classList.add('hid');return}const my=st.units.some(u=>u.side=='p');if(tut==0&&(my||st.piles.length||Object.values(st.bench).some(n=>n)))tut=1;if(tut==1&&(my||st.piles.length))tut=2;if(tut==2&&my){tut=3;setTimeout(()=>{if(tut==3)tutEnd()},10000)}tip.textContent=TS[tut];tip.classList.remove('hid')}
function tutEnd(){tut=-1;M.tut=1;save();tip.classList.add('hid')}tip.onclick=()=>{if(tut==3)tutEnd()};
const fe=(ty,x,y,s,t)=>{c.save();c.translate(x,y);c.scale(-s,s);dE({ty,w:EN[ty].w,h:EN[ty].h,tm:t});c.restore()};

const cap=['It is 2030. Technology is evolving fast,|and stationery is being forgotten.','The electronics army is invading Stationery Land|and attacking the Resistance base!','The Stationery Resistance rises! Buy, drag and|combine your gear into powerful weapons.','Defend your base. Destroy theirs.|Commander, the fight is yours!'][sc];
if(sc==0){['pencil','eraser','ruler','pen','stapler'].forEach((q,i)=>spr(q,170+i*85,G-22+Math.sin(t*3+i)*3,1.5,0));['phone','laptop','mouse','tv'].forEach((q,i)=>fe(q,1150-Math.min(k,2.4)*190-i*110,G,1.6,t));c.textAlign='center';c.globalAlpha=Math.min(1,k);c.font='700 64px Fredoka,system-ui';c.fillStyle='#2a3d7c';c.fillText('2030',500,160);c.globalAlpha=1}
else if(sc==1){dBase(PB,1,1,1,0);['mouse','phone','laptop','drone','stylus','tv','notebook'].forEach((q,i)=>fe(q,1150-k*270+i*100,EN[q].f?AIR:G,1.5,t));c.fillStyle='#ff000018';c.fillRect(0,0,W,H)}
else if(sc==2){const j=Math.min(k/1.4,1);if(k<1.6){spr('stapler',300+j*160,G-22,1.8,0);spr('pencil',700-j*200,G-22,1.8,0)}else{const q=k-1.6;c.save();c.translate(460+q*220,G);c.scale(2,2);dCombo({id:'car',k:'b',items:['stapler','pencil'],x:q*220,tm:t,rc:0});c.restore();c.strokeStyle='#ffd54f';c.lineWidth=4;c.globalAlpha=Math.max(0,1-q*2);c.beginPath();c.arc(460,G-30,q*180,0,7);c.stroke();c.globalAlpha=1}}
else{c.textAlign='center';c.lineJoin='round';c.lineWidth=12;c.strokeStyle='#5b6475';c.fillStyle='#ffc93c';c.font='700 70px Fredoka,system-ui';c.strokeText('RESISTANCE',500,170);c.fillText('RESISTANCE',500,170);c.font='700 46px Fredoka,system-ui';c.strokeText('OF STATIONERY',500,222);c.fillText('OF STATIONERY',500,222);[['car','b',['stapler','pencil']],['prop','f',['pen','ruler']],['wall','m',['pencil','pencil','pencil']]].forEach(([id,kd,it],i)=>{c.save();c.translate(260+i*240,id=='prop'?G-90:G);c.scale(1.8,1.8);dCombo({id,k:kd,items:it,x:0,tm:t,rc:0});c.restore()})}
c.textAlign='center';c.fillStyle='#0b1020cc';c.beginPath();c.roundRect(110,14,780,66,14);c.fill();c.fillStyle='#fff';c.font='600 20px Fredoka,system-ui';cap.split('|').forEach((s,i)=>c.fillText(s,500,44+i*26));c.fillStyle='#ffc93c';c.font='12px Fredoka,system-ui';c.fillText('TAP TO CONTINUE',500,H-10);c.textAlign='start';
c.fillStyle='rgba(0,0,0,'+Math.max(1-k*3,(k-3.2)*2.5,0)+')';c.fillRect(0,0,W,H)}
/* ---------- boot ---------- */
rc();ui();let last=performance.now(),ua=0;M.seen?menu():intro();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(st&&st.status=='play'){upd(dt);ua+=dt;if(ua>.1){ua=0;ui()}}else if(st)for(const f of st.fx){f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;f.l-=dt}render();requestAnimationFrame(loop)})(last);
